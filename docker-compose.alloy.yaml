services:
  web:
    image: node:22-bookworm-slim
    working_dir: /workspace
    network_mode: host
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      IS_ALLOY: ${IS_ALLOY:-false}
      NODE_ENV: development
    env_file:
      - .env.local
    volumes:
      - .:/workspace
      - twitch_clone_node_modules:/workspace/node_modules
    command: bash -lc "npm install --no-audit --no-fund && npm run dev"

volumes:
  twitch_clone_node_modules:
